services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookline
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookline -d hookline"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hookline:local-demo-only@db:5432/hookline
      WEBHOOK_SECRET: local-compose-secret-change-before-sharing
    depends_on:
      db:
        condition: service_healthy
